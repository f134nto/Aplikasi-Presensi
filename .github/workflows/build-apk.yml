name: Build Android APK

on:
  push:
    branches: [ "utama", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "2482550e5008502a3a0e104e760c239d5718a287\n84831b9409646a578f30576b658f0649a3f25c32\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2482550e5008502a3a0e104e760c239d5718a287\n869f03222dd81132644265cc2817c1ba420950a7" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a578f30576b658f0649a3f25c32\n504667f4c0d03d201132f89104332467b7f14b30\n71465410008643801612221e038553517109267e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Prepare build environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Presensi-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
